<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Knowledge Compiler — Semantic Navigation Review</title>
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <header>
    <div><span class="eyebrow">Knowledge Compiler · SPEC-007</span><h1>Semantic navigation review</h1></div>
    <label>Domain <select id="domain"></select></label>
  </header>
  <main>
    <section class="experiment-bar" aria-labelledby="mode-title">
      <div><span class="eyebrow">Comparison mode</span><h2 id="mode-title">Choose how deeper detail opens</h2></div>
      <div id="modes" class="mode-selector" role="group" aria-label="Semantic navigation mode"></div>
    </section>
    <section class="overview" aria-labelledby="model-title">
      <div><span class="eyebrow">Overview</span><h2 id="model-title">Loading…</h2></div>
      <div id="global-warnings" class="warnings"></div>
      <nav id="representations" aria-label="Detected representations"></nav>
    </section>
    <section class="workspace">
      <article class="canvas-card">
        <div id="resolution-banner" class="resolution-banner" aria-live="polite"></div>
        <section id="parent-context" class="parent-context" hidden aria-label="Parent model context">
          <div class="context-copy"><span class="eyebrow">Parent context</span><h2 id="context-title"></h2><p id="context-focus"></p></div>
          <svg id="context-graph" role="img" aria-label="Compact parent model showing explored concept"></svg>
        </section>
        <div class="structure-heading">
          <div><span id="salience" class="badge"></span><h2 id="structure-title"></h2></div>
          <div class="structure-actions"><p id="structure-meta"></p><button id="clear-selection" disabled>Clear selection</button></div>
        </div>
        <div id="structure-warnings" class="warnings"></div>
        <div id="empty-state" class="empty" hidden></div>
        <svg id="graph" role="img" aria-label="Directed semantic structure"></svg>
        <div id="edge-list" class="edge-list" aria-label="Relationships in this representation"></div>
      </article>
      <aside id="detail" aria-live="polite">
        <span class="eyebrow">Detail</span>
        <h2>Select a node or edge</h2>
        <p>Inspect what a concept means, or why a relationship exists and which source evidence supports it.</p>
      </aside>
    </section>
  </main>
  <script src="viewer.js"></script>
</body>
</html>
