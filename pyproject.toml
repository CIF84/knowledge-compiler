[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-compiler"
version = "0.1.0"
description = "Compile explanatory text into a grounded semantic knowledge model."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Knowledge Compiler contributors" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10"]
llm = ["openai>=2,<3"]

[project.scripts]
knowledge-compiler = "knowledge_compiler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
